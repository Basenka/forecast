
<p-table
  #dt
  [value]="data"
  [paginator]="true"
  [rows]="10"
  [globalFilterFields]="[
  'datetime',
  'weather',
  'temperature',
  'humidity',
  'pressure',
  'type'
  ]"
  [sortField]="'datetime'"
  [sortOrder]="1"
  [sortMode]="'multiple'"
>

  <ng-template pTemplate="caption">
    <div class="toolbar">

      <p-datePicker
        [(ngModel)]="dateRange"
        selectionMode="range"
        placeholder="Select date range"
        dateFormat="dd.mm.yy"
        [maxDate]="today"
        (ngModelChange)="onDateChange($event)"
      ></p-datePicker>

      <p-button
        label="Clear date filter"
        icon="pi pi-times"
        (onClick)="clearDateRange()"
        class="p-button-secondary"
      ></p-button>

      <input
        pInputText
        type="text"
        (input)="dt.filterGlobal($any($event.target).value, 'contains')"
        placeholder="Search..."
      />

      <p-button
        label="Clear"
        [outlined]="true"
        icon="pi pi-filter-slash"
        (onClick)="clear(dt)"
      ></p-button>

    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="datetime">Datetime
        <p-sortIcon field="datetime"></p-sortIcon>
        <p-columnFilter type="date" field="datetime" display="menu" />
      </th>
      <th pSortableColumn="weather" >Weather
        <p-sortIcon field="weather"></p-sortIcon>
        <p-columnFilter field="weather" display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="temperature">Temp (°C)
        <p-sortIcon field="temperature"></p-sortIcon>
        <p-columnFilter type="numeric" field="temperature" display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="humidity">Humidity (%)
        <p-sortIcon field="humidity"></p-sortIcon>
        <p-columnFilter type="numeric" field="humidity" display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="pressure">Pressure (hPa)
        <p-sortIcon field="pressure"></p-sortIcon>
        <p-columnFilter type="numeric" field="pressure" display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="type">Type
        <p-sortIcon field="type"></p-sortIcon>
        <p-columnFilter field="type" display="menu">
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <div *ngFor="let option of ['forecast', 'historical']">
              <p-checkbox
                [binary]="true"
                (onChange)="filter(option)"
              ></p-checkbox>

              <label>{{ option }}</label>
            </div>
          </ng-template>
        </p-columnFilter>
      </th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.datetime | date:'dd.MM.yyyy HH:mm' }}</td>
      <td>{{ row.weather }}</td>
      <td>{{ row.temperature }}</td>
      <td>{{ row.humidity }}</td>
      <td>{{ row.pressure }}</td>
      <td>
  <span
    [ngClass]="{
      'forecast': row.type === 'forecast',
      'historical': row.type === 'historical'
    }"
    class="badge"
  >
    {{ row.type }}
  </span>
      </td>
    </tr>
  </ng-template>

</p-table>
